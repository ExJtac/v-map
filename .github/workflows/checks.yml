name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:hosted
      - run: node scripts/build-domain.mjs
      - run: npm run verify:packaged
      - run: node scripts/verify-seo-canonicals.mjs --require-artifacts
      - run: node scripts/verify-candidate-profiles.mjs --require-artifacts
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
